<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace — OgaProp</title><link rel="stylesheet" href="assets/site.css"><script defer src="assets/site.js"></script></head><body><div data-site-header></div><main><section class="pagehead"><div class="wrap"><div class="eyebrow">Marketplace</div><h1>Browse verified property in Abuja.</h1><p class="lead" style="max-width:680px">Search, filter and compare homes, land and rentals. Every verified listing can lead into a property page with its verification record.</p></div></section><section class="filters"><div class="wrap"><div class="filter-grid"><input id="search" placeholder="Search area, property or type"><select id="intent"><option value="all">Buy & Rent</option><option value="buy">For sale</option><option value="rent">For rent</option></select><select id="area"><option>All Abuja</option><option>Maitama</option><option>Asokoro</option><option>Guzape</option><option>Wuse 2</option><option>Jabi</option><option>Gwarinpa</option><option>Katampe</option><option>Life Camp</option></select><select id="type"><option>All types</option><option>Apartment</option><option>Detached Duplex</option><option>Terrace</option><option>Villa</option><option>Land</option></select><select><option>Any beds</option><option>2+ beds</option><option>3+ beds</option><option>4+ beds</option><option>5+ beds</option></select><select><option>Any price</option><option>Under ₦100M</option><option>₦100M–₦250M</option><option>₦250M+</option></select></div></div></section><section class="section"><div class="wrap"><div><b id="count" style="font-size:20px">8 properties</b><span class="meta"> matching your search</span></div><div id="grid" class="grid3" style="margin-top:26px"></div></div></section></main><div data-site-footer></div><script>const P=[['guzape-duplex','Contemporary 4-Bedroom Duplex','Guzape','buy','Detached Duplex','₦185,000,000',4,5,'650 sqm','https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=82'],['maitama-residence','Premium Family Residence','Maitama','buy','Detached Duplex','₦420,000,000',5,6,'920 sqm','https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?auto=format&fit=crop&w=900&q=82'],['jabi-terrace','Modern Terrace Home','Jabi','buy','Terrace','₦95,000,000',4,4,'410 sqm','https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=900&q=82'],['asokoro-villa','Private 5-Bedroom Villa','Asokoro','buy','Villa','₦510,000,000',5,6,'980 sqm','https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=900&q=82'],['wuse-apartment','Serviced 3-Bedroom Apartment','Wuse 2','rent','Apartment','₦12,500,000 / yr',3,4,'245 sqm','https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=900&q=82'],['life-camp-home','Contemporary Family Home','Life Camp','rent','Detached Duplex','₦18,000,000 / yr',4,5,'520 sqm','https://images.unsplash.com/photo-1600573472591-ee6b68d14c68?auto=format&fit=crop&w=900&q=82'],['katampe-land','Residential Land Parcel','Katampe','buy','Land','₦160,000,000',0,0,'1,250 sqm','https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=900&q=82'],['gwarinpa-townhouse','Modern 4-Bedroom Townhouse','Gwarinpa','buy','Terrace','₦82,000,000',4,4,'380 sqm','https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=900&q=82']];const g=document.getElementById('grid'),q=document.getElementById('search'),i=document.getElementById('intent'),a=document.getElementById('area'),t=document.getElementById('type'),c=document.getElementById('count');const params=new URLSearchParams(location.search);if(params.get('intent'))i.value=params.get('intent');if(params.get('area'))a.value=params.get('area');function render(){let f=P.filter(p=>(!q.value||p.slice(1,5).join(' ').toLowerCase().includes(q.value.toLowerCase()))&&(i.value==='all'||p[3]===i.value)&&(a.value==='All Abuja'||p[2]===a.value)&&(t.value==='All types'||p[4]===t.value));c.textContent=f.length+' properties';g.innerHTML=f.map(p=>`<article class="property"><a href="property.html?id=${p[0]}"><div class="photo"><img src="${p[9]}"><span class="badge">✓ OgaProp Verified</span></div><div class="property-body"><div class="meta">${p[2]}, Abuja · ${p[3]==='buy'?'For sale':'For rent'}</div><h3>${p[1]}</h3><div class="features">${p[6]?`<span>${p[6]} beds</span><span>${p[7]} baths</span>`:''}<span>${p[8]}</span></div><div class="price"><span>${p[5]}</span><span>View property</span></div></div></a></article>`).join('')}for(const x of [q,i,a,t])x.oninput=render}render()</script></body></html>
