<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get Started — OgaProp</title><link rel="stylesheet" href="assets/auth.css"><script src="https://unpkg.com/@phosphor-icons/web"></script></head><body><main class="auth-shell"><section class="visual"><img id="stepImage" src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1800&q=88"><div class="visual-inner"><a class="brand" href="index.html"><span class="mark"></span><span>Oga<b>Prop</b></span></a><div class="visual-copy fade-enter" id="visualCopy"><span class="pill"><i class="ph ph-sparkle"></i> Step <span id="stepNo">1</span> of 3</span><div class="eyebrow" id="visualEyebrow" style="margin-top:18px">Welcome to OgaProp</div><h1 id="visualTitle">Property decisions should start with clarity.</h1><p id="visualText">Find the property. Understand the checks. Move forward with more confidence.</p></div></div></section><section class="panel"><div class="panel-top"><a class="brand mobile-brand" href="index.html"><span class="mark" style="background:var(--black)"></span><span>Oga<b>Prop</b></span></a><a class="skip" href="register.html">Skip onboarding</a></div><div class="panel-main"><div class="progress"><span class="active"></span><span></span><span></span></div><div id="stepContent" class="fade-enter"></div><div class="steps-nav"><button class="btn" id="back"><i class="ph ph-arrow-left"></i> Back</button><button class="btn dark" id="next">Continue <i class="ph ph-arrow-right"></i></button></div></div><div class="panel-foot">Already have an account? <a href="login.html" style="font-weight:800;color:var(--text)">Log in</a></div></section></main><script>const steps=[{eyebrow:'Welcome to OgaProp',title:'Property decisions should start with clarity.',lead:'Discover homes, land and rentals with verification information visible from the beginning.',image:'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1800&q=88',visual:'Find the property. Understand the checks. Move forward with more confidence.',html:`<div class="eyebrow">Welcome to OgaProp</div><h2>Property decisions should start with clarity.</h2><p class="lead">Discover homes, land and rentals with verification information visible from the beginning.</p><div class="feature-grid"><div class="feature"><i class="ph ph-house-line"></i><h3>Browse with context</h3><p>Compare property details, location, price and trust information in one place.</p></div><div class="feature"><i class="ph ph-check-circle"></i><h3>Keep your journey together</h3><p>Save properties, request inspections and continue from where you stopped.</p></div></div>`},{eyebrow:'Built around trust',title:'See what supports a verified listing.',lead:'OgaProp connects property discovery with document-led checks, inspection support and a visible verification record.',image:'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1800&q=88',visual:'Verification should be something you can inspect, not just a badge you are asked to trust.',html:`<div class="eyebrow">Built around trust</div><h2>See what supports a verified listing.</h2><p class="lead">OgaProp connects property discovery with document-led checks, inspection support and a visible verification record.</p><div class="trust-box"><i class="ph ph-shield-check"></i><div class="trust-line"><span><i class="ph ph-check"></i></span>Property and participant information</div><div class="trust-line"><span><i class="ph ph-check"></i></span>Supporting document review</div><div class="trust-line"><span><i class="ph ph-check"></i></span>Inspection and verification status</div></div>`},{eyebrow:'Make OgaProp yours',title:'Choose how you will use OgaProp.',lead:'Your account experience will adapt to what you want to do first. You can change this later.',image:'https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?auto=format&fit=crop&w=1800&q=88',visual:'One marketplace, different journeys for buyers, diaspora users, agents, owners and developers.',html:`<div class="eyebrow">Make OgaProp yours</div><h2>What brings you to OgaProp?</h2><p class="lead">Choose the account type that best matches what you want to do first.</p><div class="role-grid"><button class="role selected" data-pick="buyer"><span class="check"><i class="ph ph-check"></i></span><i class="ph ph-house-line"></i><h3>Buyer / Renter</h3><p>Discover, save and inspect property.</p></button><button class="role" data-pick="diaspora"><span class="check"><i class="ph ph-check"></i></span><i class="ph ph-globe-hemisphere-west"></i><h3>Diaspora Buyer</h3><p>Search remotely with guided support.</p></button><button class="role" data-pick="agent"><span class="check"><i class="ph ph-check"></i></span><i class="ph ph-user-circle"></i><h3>Agent / Owner</h3><p>List and manage trusted inventory.</p></button><button class="role" data-pick="developer"><span class="check"><i class="ph ph-check"></i></span><i class="ph ph-buildings"></i><h3>Developer</h3><p>Present developments and verified units.</p></button></div>`}];let step=0,role='buyer';const content=document.getElementById('stepContent'),img=document.getElementById('stepImage');function render(){const s=steps[step];content.classList.remove('fade-enter');void content.offsetWidth;content.classList.add('fade-enter');content.innerHTML=s.html;document.getElementById('stepNo').textContent=step+1;document.getElementById('visualEyebrow').textContent=s.eyebrow;document.getElementById('visualTitle').textContent=s.title;document.getElementById('visualText').textContent=s.visual;img.style.opacity='.2';setTimeout(()=>{img.src=s.image;img.onload=()=>img.style.opacity='1'},100);document.querySelectorAll('.progress span').forEach((x,i)=>x.classList.toggle('active',i<=step));document.getElementById('back').style.visibility=step===0?'hidden':'visible';document.getElementById('next').innerHTML=step===2?'Create my account <i class="ph ph-arrow-right"></i>':'Continue <i class="ph ph-arrow-right"></i>';document.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{role=x.dataset.pick;document.querySelectorAll('[data-pick]').forEach(y=>y.classList.toggle('selected',y===x))})}document.getElementById('next').onclick=()=>{if(step<2){step++;render()}else location.href='register.html?role='+role};document.getElementById('back').onclick=()=>{if(step>0){step--;render()}};render();</script></body></html>
