<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My OgaProp — Dashboard</title><link rel="stylesheet" href="assets/site.css"><script src="https://unpkg.com/@phosphor-icons/web"></script><script defer src="assets/site.js"></script><style>body{background:#f7f7f5}.dashwrap{max-width:1240px;margin:auto;padding:42px 24px}.dashhead{display:flex;align-items:end;justify-content:space-between;gap:22px;border-bottom:1px solid var(--line);padding-bottom:26px}.dashhead h1{font-size:34px;letter-spacing:-.04em;margin:6px 0}.account-switch{height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font:800 12px Manrope,sans-serif}.tabs{display:flex;gap:8px;overflow:auto;padding:22px 0 2px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font:800 12px Manrope,sans-serif;white-space:nowrap}.tabs button.active{background:var(--black);color:#fff;border-color:var(--black)}.hero{margin-top:24px;background:var(--black);color:#fff;border-radius:30px;padding:34px}.hero h2{font-size:34px;letter-spacing:-.04em;margin:7px 0}.hero p{color:#aaa;font-size:13px;max-width:650px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat span{font-size:11px;color:var(--slate)}.stat b{display:block;font-size:30px;margin-top:8px}.tablewrap{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:auto}.tablewrap table{width:100%;min-width:720px;border-collapse:collapse}.tablewrap th{background:#fafaf8;color:var(--slate);font-size:10px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:13px 18px}.tablewrap td{padding:16px 18px;border-top:1px solid var(--line);font-size:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:10px;font-weight:800}.section-title{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-top:28px}.section-title h2{margin:0;font-size:24px}.empty{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px}.danger{color:#c33;border:0;background:none}.action{border:0;background:none;padding:8px}.modalback{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:3000}.modalback.open{display:grid}.modal{width:min(520px,100%);background:#fff;border-radius:26px;padding:26px}.modal h3{font-size:22px;margin:0 0 16px}.formgrid{display:grid;gap:14px}.formgrid label{font-size:11px;font-weight:800}.formgrid input,.formgrid select{margin-top:7px;width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:800px){.dashhead{align-items:stretch;flex-direction:column}.stats{grid-template-columns:1fr}.dashwrap{padding:28px 18px}.hero h2{font-size:28px}}</style></head><body><div data-site-header></div><main class="dashwrap"><div class="dashhead"><div><div class="eyebrow">My OgaProp</div><h1 id="dashTitle">Buyer / Renter dashboard</h1><p class="lead">Only the things this account needs.</p></div><select id="accountSwitch" class="account-switch"><option value="buyer">Buyer / Renter</option><option value="lister">Property Lister</option></select></div><div class="tabs" id="tabs"></div><div id="dashContent"></div></main><div data-site-footer></div><div class="modalback" id="inspectionModal"><div class="modal"><h3 id="modalTitle">Book an inspection</h3><form id="inspectionForm" class="formgrid"><label>Property<input id="fProperty" required></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Date<input id="fDate" required></label><label>Time<input id="fTime" required></label></div><label>Type<select id="fType"><option>Physical</option><option>Video</option></select></label><div class="modalactions"><button type="button" class="btn" id="closeModal">Cancel</button><button class="btn dark">Save inspection</button></div></form></div></div><div class="modalback" id="confirmModal"><div class="modal"><h3>Remove this item?</h3><p class="lead" id="confirmText">This action can be changed later when the backend is connected.</p><div class="modalactions"><button class="btn" id="cancelDelete">Cancel</button><button class="btn dark" id="confirmDelete">Remove</button></div></div></div><script>let q=new URLSearchParams(location.search),mode=q.get('view')==='lister'?'lister':'buyer',page=q.get('section')||'overview',editing=null,pendingDelete=null;let saved=[{id:1,property:'Contemporary 4-Bedroom Duplex',area:'Guzape',price:'₦185M',status:'Verified'},{id:2,property:'Modern Terrace Home',area:'Jabi',price:'₦95M',status:'Verified'},{id:3,property:'Premium Family Residence',area:'Maitama',price:'₦420M',status:'Verified'}],inspections=[{id:1,property:'Contemporary 4-Bedroom Duplex',date:'12 Sep 2026',time:'10:30 AM',type:'Physical',status:'Upcoming'},{id:2,property:'Premium Family Residence',date:'16 Sep 2026',time:'2:00 PM',type:'Video',status:'Upcoming'},{id:3,property:'Modern Terrace Home',date:'28 Aug 2026',time:'11:00 AM',type:'Physical',status:'Completed'}];const tabs={buyer:[['overview','Overview'],['saved','Saved'],['inspections','Inspections']],lister:[['overview','Overview'],['properties','Properties'],['enquiries','Enquiries']]};function stats(items){return `<div class="stats">${items.map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}<th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function setUrl(){history.replaceState(null,'',`dashboard.html?view=${mode}&section=${page}`)}function render(){document.getElementById('accountSwitch').value=mode;document.getElementById('dashTitle').textContent=(mode==='buyer'?'Buyer / Renter':'Property Lister')+' dashboard';document.getElementById('tabs').innerHTML=tabs[mode].map(x=>`<button class="${page===x[0]?'active':''}" data-page="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;setUrl();render()});const c=document.getElementById('dashContent');if(mode==='buyer'&&page==='overview'){c.innerHTML=`<section class="hero"><div class="eyebrow">Good evening</div><h2>Continue your property search.</h2><p>Saved homes and inspection plans stay close without turning your account into a complicated app.</p><a class="btn" style="margin-top:18px;background:#fff" href="marketplace.html"><i class="ph ph-magnifying-glass"></i> Browse properties</a></section>${stats([['Saved properties',saved.length],['Upcoming inspections',inspections.filter(x=>x.status==='Upcoming').length],['Verified saves',saved.length]])}<div class="section-title"><h2>Upcoming inspections</h2></div>${table(['Property','Date','Time','Inspection'],inspections.filter(x=>x.status==='Upcoming').map(x=>`<tr><td><b>${x.property}</b></td><td>${x.date}</td><td>${x.time}</td><td>${x.type}</td><td></td></tr>`))}`;return}if(mode==='buyer'&&page==='saved'){c.innerHTML=`<div class="section-title"><div><h2>Saved properties</h2><p class="lead">Your shortlist while you compare.</p></div><a class="btn dark" href="marketplace.html">Find property</a></div>${table(['Property','Area','Price','Status'],saved.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.area}</td><td>${x.price}</td><td><span class="badge">${x.status}</span></td><td><button class="action danger" data-delete-saved="${x.id}"><i class="ph ph-trash"></i></button></td></tr>`))}`;document.querySelectorAll('[data-delete-saved]').forEach(b=>b.onclick=()=>openConfirm('saved',+b.dataset.deleteSaved));return}if(mode==='buyer'&&page==='inspections'){c.innerHTML=`<div class="section-title"><div><h2>Inspections</h2><p class="lead">Schedule and manage visits.</p></div><button class="btn dark" id="bookInspection"><i class="ph ph-plus"></i> Book inspection</button></div>${stats([['Upcoming',inspections.filter(x=>x.status==='Upcoming').length],['Completed',inspections.filter(x=>x.status==='Completed').length],['Total',inspections.length]])}${table(['Property','Date','Time','Inspection','Status'],inspections.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.date}</td><td>${x.time}</td><td>${x.type}</td><td><span class="badge">${x.status}</span></td><td><button class="action" data-edit="${x.id}"><i class="ph ph-pencil-simple"></i></button><button class="action danger" data-delete-inspection="${x.id}"><i class="ph ph-trash"></i></button></td></tr>`))}`;document.getElementById('bookInspection').onclick=()=>openInspection();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openInspection(+b.dataset.edit));document.querySelectorAll('[data-delete-inspection]').forEach(b=>b.onclick=()=>openConfirm('inspection',+b.dataset.deleteInspection));return}if(mode==='lister'&&page==='overview'){c.innerHTML=`<section class="hero"><div class="eyebrow">Property Lister</div><h2>Manage your properties simply.</h2><p>Listings and enquiries stay in the same familiar OgaProp shell.</p></section>${stats([['Active properties','8'],['New enquiries','12'],['Awaiting verification','2']])}`;return}c.innerHTML=`<div class="empty"><div class="eyebrow">${mode==='buyer'?'Buyer / Renter':'Property Lister'}</div><h2 style="text-transform:capitalize">${page}</h2><p class="lead">This area will use the same reusable dashboard patterns as we build the workflow.</p></div>`}document.getElementById('accountSwitch').onchange=e=>{mode=e.target.value;page='overview';setUrl();render()};function openInspection(id){editing=id?inspections.find(x=>x.id===id):null;document.getElementById('modalTitle').textContent=editing?'Edit inspection':'Book an inspection';document.getElementById('fProperty').value=editing?.property||'';document.getElementById('fDate').value=editing?.date||'';document.getElementById('fTime').value=editing?.time||'';document.getElementById('fType').value=editing?.type||'Physical';document.getElementById('inspectionModal').classList.add('open')}document.getElementById('closeModal').onclick=()=>document.getElementById('inspectionModal').classList.remove('open');document.getElementById('inspectionForm').onsubmit=e=>{e.preventDefault();const obj={property:fProperty.value,date:fDate.value,time:fTime.value,type:fType.value,status:'Upcoming'};if(editing)Object.assign(editing,obj);else inspections.unshift({id:Date.now(),...obj});inspectionModal.classList.remove('open');render()};function openConfirm(kind,id){pendingDelete={kind,id};confirmText.textContent=kind==='saved'?'Remove this property from your saved list?':'Remove this inspection from your schedule?';confirmModal.classList.add('open')}cancelDelete.onclick=()=>confirmModal.classList.remove('open');confirmDelete.onclick=()=>{if(pendingDelete.kind==='saved')saved=saved.filter(x=>x.id!==pendingDelete.id);else inspections=inspections.filter(x=>x.id!==pendingDelete.id);confirmModal.classList.remove('open');render()};render();</script></body></html>
