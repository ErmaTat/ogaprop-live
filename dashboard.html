<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My OgaProp — Dashboard</title><link rel="stylesheet" href="assets/site.css"><script src="https://unpkg.com/@phosphor-icons/web"></script><script defer src="assets/site.js"></script><style>body{background:#f7f7f5}.workspace{width:min(1240px,calc(100% - 40px));margin:32px auto 52px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}.dashside{position:sticky;top:106px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 14px 38px #0000000b}.sideintro{padding:10px 10px 15px;border-bottom:1px solid var(--line)}.sideintro small{font-size:9px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.12em}.sideintro b{display:block;margin-top:4px;font-size:13px}.dashnav{display:flex;flex-direction:column;gap:4px;padding:12px 0}.dashnav button{border:0;background:none;width:100%;display:flex;align-items:center;gap:10px;padding:11px;border-radius:11px;font-size:12px;font-weight:800;color:var(--slate);text-align:left}.dashnav button.active{background:var(--black);color:#fff}.dashnav i{font-size:17px}.sidefoot{border-top:1px solid var(--line);padding-top:12px}.sidefoot a{display:flex;gap:8px;align-items:center;padding:10px;font-size:11px;font-weight:800}.dashmain{min-width:0}.dashtop{position:sticky;top:98px;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:13px 16px;box-shadow:0 12px 34px #0000000a;display:flex;align-items:center;justify-content:space-between;gap:16px}.dashtop h1{font-size:17px;margin:0}.dashtop p{margin:2px 0 0;font-size:10px;color:var(--slate)}.topactions{display:flex;align-items:center;gap:8px}.account-switch{height:39px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 11px;font-size:11px;font-weight:800}.iconbtn{width:39px;height:39px;border:1px solid var(--line);border-radius:10px;background:#fff;display:grid;place-items:center}.content{padding-top:20px}.hero{background:var(--black);color:#fff;border-radius:28px;padding:32px}.hero h2{font-size:31px;letter-spacing:-.04em;margin:7px 0}.hero p{color:#aaa;font-size:13px;max-width:650px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat span{font-size:11px;color:var(--slate)}.stat b{display:block;font-size:29px;margin-top:8px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-top:28px}.section-title h2{margin:0;font-size:23px}.tablewrap{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:auto}.tablewrap table{width:100%;min-width:720px;border-collapse:collapse}.tablewrap th{background:#fafaf8;color:var(--slate);font-size:9px;text-transform:uppercase;text-align:left;padding:13px 17px}.tablewrap td{padding:15px 17px;border-top:1px solid var(--line);font-size:11px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:var(--green-soft);color:var(--green);font-size:9px;font-weight:800}.pill.pending{background:#fff6dc;color:#986a00}.action{border:0;background:none;padding:7px}.cards,.profilegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card,.fieldcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card p{font-size:11px;color:var(--slate)}.fieldcard small{color:var(--slate);font-size:9px;text-transform:uppercase;font-weight:800}.fieldcard b{display:block;margin-top:7px;font-size:12px}.modalback{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:3000}.modalback.open{display:grid}.modal{width:min(540px,100%);background:#fff;border-radius:25px;padding:25px}.formgrid{display:grid;gap:13px}.formgrid label{font-size:10px;font-weight:800}.formgrid input,.formgrid select{margin-top:6px;width:100%;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:900px){.workspace{grid-template-columns:1fr}.dashside{position:static}.dashtop{top:88px}}@media(max-width:600px){.workspace{width:min(100% - 28px,1240px)}.stats,.cards,.profilegrid{grid-template-columns:1fr}.dashside{overflow:auto}.dashnav{display:grid;grid-template-columns:1fr 1fr}.hero h2{font-size:26px}}</style></head><body><div data-site-header></div><main class="workspace"><aside class="dashside"><div class="sideintro"><small>My OgaProp</small><b id="sideTitle"></b></div><nav class="dashnav" id="dashNav"></nav><div class="sidefoot"><a href="marketplace.html"><i class="ph ph-magnifying-glass"></i>Explore marketplace</a></div></aside><section class="dashmain"><header class="dashtop"><div><h1 id="pageTitle"></h1><p id="pageNote"></p></div><div class="topactions"><button class="iconbtn"><i class="ph ph-bell"></i></button><select id="accountSwitch" class="account-switch"><option value="buyer">Buyer / Renter</option><option value="lister">Property Lister</option></select></div></header><div class="content" id="dashContent"></div></section></main><div data-site-footer></div><div class="modalback" id="appModal"><div class="modal"><h3 id="modalTitle"></h3><div id="modalBody"></div></div></div><div class="modalback" id="confirmModal"><div class="modal"><h3>Confirm action</h3><p class="lead" id="confirmText"></p><div class="modalactions"><button class="btn" onclick="confirmModal.classList.remove('open')">Cancel</button><button class="btn dark" id="confirmBtn">Confirm</button></div></div></div><script>let q=new URLSearchParams(location.search),mode=q.get('view')==='lister'?'lister':'buyer',page=q.get('section')||'overview';let saved=[{id:1,property:'Contemporary 4-Bedroom Duplex',area:'Guzape',price:'₦185M',status:'Verified'},{id:2,property:'Modern Terrace Home',area:'Jabi',price:'₦95M',status:'Verified'}],inspections=[{id:1,property:'Contemporary 4-Bedroom Duplex',date:'12 Sep 2026',time:'10:30 AM',type:'Physical',status:'Upcoming'},{id:2,property:'Premium Family Residence',date:'16 Sep 2026',time:'2:00 PM',type:'Video',status:'Upcoming'}],enquiries=[{property:'Guzape Duplex',sent:'Today',message:'Is the title report available?',status:'Open'},{property:'Jabi Terrace',sent:'31 Aug',message:'Is this still available?',status:'Replied'}],properties=[{id:1,property:'Guzape Duplex',area:'Guzape',price:'₦185M',status:'Active',verification:'Verified'},{id:2,property:'Jabi Terrace',area:'Jabi',price:'₦95M',status:'Active',verification:'Pending'}],listerEnquiries=[{buyer:'Adaeze Okafor',property:'Guzape Duplex',received:'Today',status:'New'},{buyer:'Tunde Bello',property:'Jabi Terrace',received:'Yesterday',status:'Replied'}];const menus={buyer:[['overview','house-line','Overview'],['saved','heart','Saved'],['inspections','calendar-check','Inspections'],['enquiries','chats-circle','Enquiries'],['verification','shield-check','Verification'],['profile','user-circle','Profile']],lister:[['overview','house-line','Overview'],['properties','buildings','Properties'],['enquiries','chats-circle','Enquiries'],['verification','shield-check','Verification'],['profile','user-circle','Profile']]};function setUrl(){history.replaceState(null,'',`dashboard.html?view=${mode}&section=${page}`)}function stats(a){return `<div class="stats">${a.map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}function table(h,r){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}<th></th></tr></thead><tbody>${r.join('')}</tbody></table></div>`}function pill(v){return `<span class="pill ${['Pending','Open','New'].includes(v)?'pending':''}">${v}</span>`}function go(p){page=p;setUrl();render()}function render(){sideTitle.textContent=mode==='buyer'?'Buyer / Renter':'Property Lister';dashNav.innerHTML=menus[mode].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><i class="ph ph-${x[1]}"></i>${x[2]}</button>`).join('');pageTitle.textContent=menus[mode].find(x=>x[0]===page)?.[2]||'Overview';pageNote.textContent=mode==='buyer'?'Your property activity in one place.':'Manage your listings and buyer activity.';accountSwitch.value=mode;let c=dashContent;if(mode==='buyer'){if(page==='overview')c.innerHTML=`<div class="hero"><div class="eyebrow">Good evening</div><h2>Continue your property search.</h2><p>Your shortlist, visits and conversations are organised here while the main OgaProp navigation stays available above.</p><a class="btn" style="margin-top:17px;background:#fff" href="marketplace.html">Browse properties</a></div>${stats([['Saved properties',saved.length],['Upcoming inspections',inspections.length],['Open enquiries',1]])}`;if(page==='saved')c.innerHTML=`<div class="section-title"><h2>Saved properties</h2><a class="btn dark" href="marketplace.html">Find property</a></div>${table(['Property','Area','Price','Status'],saved.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.area}</td><td>${x.price}</td><td>${pill(x.status)}</td><td><button class="action" onclick="del('saved',${x.id})"><i class="ph ph-trash"></i></button></td></tr>`))}`;if(page==='inspections')c.innerHTML=`<div class="section-title"><h2>Inspections</h2><button class="btn dark" onclick="inspectionForm()">Book inspection</button></div>${stats([['Upcoming',inspections.length],['Completed','1'],['Total',inspections.length+1]])}${table(['Property','Date','Time','Type'],inspections.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.date}</td><td>${x.time}</td><td>${x.type}</td><td><button class="action" onclick="inspectionForm(${x.id})"><i class="ph ph-pencil-simple"></i></button></td></tr>`))}`;if(page==='enquiries')c.innerHTML=`<div class="section-title"><h2>Enquiries</h2></div>${table(['Property','Sent','Message','Status'],enquiries.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.sent}</td><td>${x.message}</td><td>${pill(x.status)}</td><td></td></tr>`))}`;if(page==='verification')c.innerHTML=`<div class="section-title"><h2>Verification</h2></div><div class="cards"><div class="card"><h3>Guzape Duplex</h3><p>Ownership and title checks completed.</p>${pill('Verified')}</div><div class="card"><h3>Maitama Residence</h3><p>Document review underway.</p>${pill('Pending')}</div></div>`;if(page==='profile')c.innerHTML=profile('Buyer / Renter','Erma Tat','erma@example.com','Abuja, Nigeria')}else{if(page==='overview')c.innerHTML=`<div class="hero"><div class="eyebrow">Property Lister</div><h2>Manage your properties simply.</h2><p>Listings, verification and enquiries stay inside this compact workspace.</p><button class="btn" style="margin-top:17px;background:#fff" onclick="propertyForm()">Add property</button></div>${stats([['Properties',properties.length],['Active listings',properties.length],['New enquiries','1']])}`;if(page==='properties')c.innerHTML=`<div class="section-title"><h2>Properties</h2><button class="btn dark" onclick="propertyForm()">Add property</button></div>${table(['Property','Area','Price','Listing','Verification'],properties.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.area}</td><td>${x.price}</td><td>${pill(x.status)}</td><td>${pill(x.verification)}</td><td><button class="action" onclick="propertyForm(${x.id})"><i class="ph ph-pencil-simple"></i></button></td></tr>`))}`;if(page==='enquiries')c.innerHTML=`<div class="section-title"><h2>Enquiries</h2></div>${table(['Buyer / Renter','Property','Received','Status'],listerEnquiries.map(x=>`<tr><td><b>${x.buyer}</b></td><td>${x.property}</td><td>${x.received}</td><td>${pill(x.status)}</td><td></td></tr>`))}`;if(page==='verification')c.innerHTML=`<div class="section-title"><h2>Verification</h2></div>${table(['Property','Area','Verification'],properties.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.area}</td><td>${pill(x.verification)}</td><td></td></tr>`))}`;if(page==='profile')c.innerHTML=profile('Property Lister','Prime Spaces Ltd','hello@primespaces.ng','Property Agent')}}function profile(t,n,e,x){return `<div class="section-title"><h2>Profile</h2><button class="btn dark" onclick="profileForm('${n}','${e}','${x}')">Edit profile</button></div><div class="profilegrid"><div class="fieldcard"><small>Account</small><b>${t}</b></div><div class="fieldcard"><small>Name</small><b>${n}</b></div><div class="fieldcard"><small>Email</small><b>${e}</b></div><div class="fieldcard"><small>${mode==='buyer'?'Location':'Lister type'}</small><b>${x}</b></div></div>`}function openModal(t,h){modalTitle.textContent=t;modalBody.innerHTML=h;appModal.classList.add('open')}function closeModal(){appModal.classList.remove('open')}function inspectionForm(id){let x=inspections.find(a=>a.id===id)||{};openModal(id?'Edit inspection':'Book inspection',`<form class="formgrid" onsubmit="saveInspection(event,${id||0})"><label>Property<input id="fp" value="${x.property||''}" required></label><label>Date<input id="fd" value="${x.date||''}" required></label><label>Time<input id="ft" value="${x.time||''}" required></label><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn dark">Save</button></div></form>`)}function saveInspection(e,id){e.preventDefault();let o={property:fp.value,date:fd.value,time:ft.value,type:'Physical',status:'Upcoming'};if(id)Object.assign(inspections.find(x=>x.id===id),o);else inspections.push({id:Date.now(),...o});closeModal();render()}function propertyForm(id){let x=properties.find(a=>a.id===id)||{};openModal(id?'Edit property':'Add property',`<form class="formgrid" onsubmit="saveProperty(event,${id||0})"><label>Property<input id="pn" value="${x.property||''}" required></label><label>Area<input id="pa" value="${x.area||''}" required></label><label>Price<input id="pp" value="${x.price||''}" required></label><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn dark">Save</button></div></form>`)}function saveProperty(e,id){e.preventDefault();let o={property:pn.value,area:pa.value,price:pp.value,status:'Active',verification:id?properties.find(x=>x.id===id).verification:'Not submitted'};if(id)Object.assign(properties.find(x=>x.id===id),o);else properties.push({id:Date.now(),...o});closeModal();render()}function profileForm(n,e,x){openModal('Edit profile',`<form class="formgrid" onsubmit="event.preventDefault();closeModal()"><label>Name<input value="${n}"></label><label>Email<input value="${e}"></label><label>Details<input value="${x}"></label><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn dark">Save</button></div></form>`)}function del(k,id){confirmText.textContent='Remove this item?';confirmBtn.onclick=()=>{if(k==='saved')saved=saved.filter(x=>x.id!==id);confirmModal.classList.remove('open');render()};confirmModal.classList.add('open')}accountSwitch.onchange=e=>{mode=e.target.value;page='overview';setUrl();render()};render();</script></body></html>
