<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — OgaProp</title><link rel="stylesheet" href="assets/site.css"><script src="https://unpkg.com/@phosphor-icons/web"></script><style>body{background:#f7f7f5}.dash{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:22px;display:flex;flex-direction:column}.switcher{margin-top:30px;position:relative}.switchbtn{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:11px;text-align:left}.switchbtn .ico{width:36px;height:36px;border-radius:11px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}.switchbtn small,.switchbtn b{display:block}.switchbtn small{font-size:9px;color:var(--slate);text-transform:uppercase}.switchbtn b{font-size:11px}.switchmenu{display:none;position:absolute;top:calc(100% + 7px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:7px;box-shadow:0 18px 45px #0002;z-index:5}.switchmenu.open{display:block}.switchmenu button{width:100%;border:0;background:none;padding:11px;border-radius:10px;text-align:left;font-size:11px;font-weight:800}.switchmenu button:hover{background:var(--soft)}.dnav{margin-top:28px}.dnav button{width:100%;border:0;background:none;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;font-size:12px;font-weight:800;color:var(--slate)}.dnav button.active{background:var(--black);color:#fff}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.content{max-width:1250px;margin:auto;padding:34px}.welcome{border-radius:30px;background:var(--black);color:#fff;padding:34px}.welcome h2{font-size:34px;letter-spacing:-.04em;margin:7px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat span{font-size:11px;color:var(--slate)}.stat b{display:block;font-size:28px;margin-top:8px}.placeholder{background:#fff;border:1px solid var(--line);border-radius:26px;padding:32px}@media(max-width:800px){.dash{grid-template-columns:1fr}.side{display:none}.stats{grid-template-columns:1fr 1fr}.content{padding:20px}.topbar{padding:0 20px}}</style></head><body><main class="dash"><aside class="side"><a class="brand" href="index.html"><span class="mark"></span><span>Oga<b>Prop</b></span></a><div class="switcher"><button class="switchbtn" id="switchbtn"><span class="ico"><i id="modeIcon" class="ph ph-house-line"></i></span><span style="flex:1"><small>Viewing as</small><b id="modeLabel">Buyer / Renter</b></span><i class="ph ph-caret-down"></i></button><div class="switchmenu" id="switchmenu"><button data-mode="buyer"><i class="ph ph-house-line"></i> Buyer / Renter</button><button data-mode="lister"><i class="ph ph-buildings"></i> Property Lister</button><button data-mode="admin"><i class="ph ph-shield-check"></i> Admin preview</button></div></div><nav class="dnav" id="dnav"></nav><div class="sidebottom"><a href="index.html" class="btn" style="border:0"><i class="ph ph-arrow-up-right"></i> View OgaProp</a></div></aside><section><header class="topbar"><div><div class="eyebrow" id="topMode">Buyer / Renter</div><b id="pageTitle">Overview</b></div><div style="display:flex;gap:9px"><button class="btn"><i class="ph ph-bell"></i></button><button class="btn"><i class="ph ph-user-circle"></i> Demo Account</button></div></header><div class="content" id="content"></div></section></main><script>const modes={buyer:{label:'Buyer / Renter',icon:'house-line',nav:[['Overview','house-line'],['Saved','heart'],['Inspections','calendar-check']]},lister:{label:'Property Lister',icon:'buildings',nav:[['Overview','house-line'],['Properties','buildings'],['Enquiries','chats-circle']]},admin:{label:'Admin preview',icon:'shield-check',nav:[['Overview','house-line'],['Properties','buildings'],['Users','users-three'],['Verification','shield-check']]}};let mode=new URLSearchParams(location.search).get('view')||'buyer',page='Overview';if(!modes[mode])mode='buyer';const menu=document.getElementById('switchmenu');document.getElementById('switchbtn').onclick=()=>menu.classList.toggle('open');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;page='Overview';menu.classList.remove('open');render()});function render(){const m=modes[mode];document.getElementById('modeLabel').textContent=m.label;document.getElementById('topMode').textContent=m.label;document.getElementById('modeIcon').className='ph ph-'+m.icon;document.getElementById('pageTitle').textContent=page;document.getElementById('dnav').innerHTML=m.nav.map(n=>`<button class="${page===n[0]?'active':''}" data-page="${n[0]}"><i class="ph ph-${n[1]}"></i>${n[0]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});const c=document.getElementById('content');if(page!=='Overview'){c.innerHTML=`<div class="placeholder"><div class="eyebrow">${m.label}</div><h2>${page}</h2><p class="lead">This area stays intentionally focused. We will add only the workflow this account actually needs.</p></div>`;return}const data=mode==='buyer'?{tag:'Good evening',title:'Continue your property search.',text:'Keep the things that matter close: saved homes and upcoming inspections.',stats:[['Saved properties','6'],['Upcoming inspections','2'],['Recent enquiries','3']]}:mode==='lister'?{tag:'Property Lister',title:'Manage your properties simply.',text:'Listings, enquiries and verification. Nothing extra.',stats:[['Active properties','8'],['New enquiries','12'],['Awaiting verification','2']]}:{tag:'Admin preview',title:'OgaProp at a glance.',text:'A compact operational view for properties, users and verification work.',stats:[['Properties','148'],['Users','324'],['Pending checks','17'],['Open enquiries','31']]};c.innerHTML=`<div class="welcome"><div class="eyebrow">${data.tag}</div><h2>${data.title}</h2><p style="color:#aaa;font-size:13px">${data.text}</p></div><div class="stats">${data.stats.map(s=>`<div class="stat"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div>`}render();</script></body></html>
