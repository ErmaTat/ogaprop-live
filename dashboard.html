<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My OgaProp — Dashboard</title><link rel="stylesheet" href="assets/site.css"><script src="https://unpkg.com/@phosphor-icons/web"></script><script defer src="assets/site.js"></script><style>body{background:#f7f7f5}.dashwrap{max-width:1240px;margin:auto;padding:42px 24px}.dashhead{display:flex;align-items:end;justify-content:space-between;gap:22px;border-bottom:1px solid var(--line);padding-bottom:26px}.dashhead h1{font-size:34px;letter-spacing:-.04em;margin:6px 0}.account-switch{height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font:800 12px Manrope,sans-serif}.tabs{display:flex;gap:8px;overflow:auto;padding:22px 0 2px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font:800 12px Manrope,sans-serif;white-space:nowrap}.tabs button.active{background:var(--black);color:#fff;border-color:var(--black)}.hero{margin-top:24px;background:var(--black);color:#fff;border-radius:30px;padding:34px}.hero-row{display:flex;align-items:end;justify-content:space-between;gap:20px}.hero h2{font-size:34px;letter-spacing:-.04em;margin:7px 0}.hero p{color:#aaa;font-size:13px;max-width:650px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat span{font-size:11px;color:var(--slate)}.stat b{display:block;font-size:30px;margin-top:8px}.tablewrap{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:auto}.tablewrap table{width:100%;min-width:760px;border-collapse:collapse}.tablewrap th{background:#fafaf8;color:var(--slate);font-size:10px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:13px 18px}.tablewrap td{padding:16px 18px;border-top:1px solid var(--line);font-size:12px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:10px;font-weight:800}.badge.amber{background:#fff7e6;color:#9a6700}.section-title{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-top:28px}.section-title h2{margin:0;font-size:24px}.action{border:0;background:none;padding:8px;border-radius:9px}.action:hover{background:#f4f4f2}.danger{color:#c33}.modalback{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px;z-index:3000}.modalback.open{display:grid}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:26px;padding:26px}.modal h3{font-size:22px;margin:0 0 16px}.formgrid{display:grid;gap:14px}.formgrid label{font-size:11px;font-weight:800}.formgrid input,.formgrid select,.formgrid textarea{margin-top:7px;width:100%;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}.formgrid input,.formgrid select{height:44px}.formgrid textarea{min-height:100px;padding:12px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.subtle{font-size:10px;color:var(--slate);margin-top:4px}.messagebox{background:#f7f7f5;border-radius:16px;padding:16px;font-size:13px;line-height:1.7}@media(max-width:800px){.dashhead,.hero-row{align-items:stretch;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.dashwrap{padding:28px 18px}.hero h2{font-size:28px}}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><div data-site-header></div><main class="dashwrap"><div class="dashhead"><div><div class="eyebrow">My OgaProp</div><h1 id="dashTitle">Buyer / Renter dashboard</h1><p class="lead">Only the things this account needs.</p></div><select id="accountSwitch" class="account-switch"><option value="buyer">Buyer / Renter</option><option value="lister">Property Lister</option></select></div><div class="tabs" id="tabs"></div><div id="dashContent"></div></main><div data-site-footer></div><div class="modalback" id="modalBack"><div class="modal"><h3 id="modalTitle"></h3><div id="modalBody"></div></div></div><div class="modalback" id="confirmModal"><div class="modal"><h3>Remove this item?</h3><p class="lead" id="confirmText"></p><div class="modalactions"><button class="btn" id="cancelDelete">Cancel</button><button class="btn dark" id="confirmDelete">Remove</button></div></div></div><script>
let q=new URLSearchParams(location.search),mode=q.get('view')==='lister'?'lister':'buyer',page=q.get('section')||'overview',pendingDelete=null;let saved=[{id:1,property:'Contemporary 4-Bedroom Duplex',area:'Guzape',price:'₦185M',status:'Verified'},{id:2,property:'Modern Terrace Home',area:'Jabi',price:'₦95M',status:'Verified'}],inspections=[{id:1,property:'Contemporary 4-Bedroom Duplex',date:'12 Sep 2026',time:'10:30 AM',type:'Physical',status:'Upcoming'},{id:2,property:'Premium Family Residence',date:'16 Sep 2026',time:'2:00 PM',type:'Video',status:'Upcoming'}],properties=[{id:1,property:'Contemporary 4-Bedroom Duplex',area:'Guzape',type:'Duplex',price:'₦185M',status:'Active',verification:'Verified'},{id:2,property:'Modern Terrace Home',area:'Jabi',type:'Terrace',price:'₦95M',status:'Active',verification:'Pending'},{id:3,property:'Serviced 3-Bedroom Apartment',area:'Wuse 2',type:'Apartment',price:'₦12.5M/yr',status:'Draft',verification:'Not submitted'},{id:4,property:'Residential Land Parcel',area:'Katampe',type:'Land',price:'₦160M',status:'Active',verification:'Verified'}],enquiries=[{id:1,buyer:'Adaeze Okafor',property:'Contemporary 4-Bedroom Duplex',channel:'Inspection',received:'Today, 10:24 AM',status:'New',email:'adaeze@example.com',message:'I would like to inspect this property this weekend.'},{id:2,buyer:'Tunde Bello',property:'Modern Terrace Home',channel:'Message',received:'Yesterday',status:'Replied',email:'tunde@example.com',message:'Please confirm whether the property is still available.'},{id:3,buyer:'Mariam Yusuf',property:'Residential Land Parcel',channel:'Verification',received:'2 Sep 2026',status:'New',email:'mariam@example.com',message:'Can I get more information about the verification documents?'}];
const tabs={buyer:[['overview','Overview'],['saved','Saved'],['inspections','Inspections']],lister:[['overview','Overview'],['properties','Properties'],['enquiries','Enquiries']]};function stats(items){return `<div class="stats">${items.map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}<th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function setUrl(){history.replaceState(null,'',`dashboard.html?view=${mode}&section=${page}`)}function render(){accountSwitch.value=mode;dashTitle.textContent=(mode==='buyer'?'Buyer / Renter':'Property Lister')+' dashboard';tabsEl=document.getElementById('tabs');tabsEl.innerHTML=tabs[mode].map(x=>`<button class="${page===x[0]?'active':''}" data-page="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;setUrl();render()});const c=dashContent;if(mode==='buyer'&&page==='overview'){c.innerHTML=`<section class="hero"><div class="eyebrow">Good evening</div><h2>Continue your property search.</h2><p>Saved homes and inspection plans stay close without turning your account into a complicated app.</p><a class="btn" style="margin-top:18px;background:#fff" href="marketplace.html"><i class="ph ph-magnifying-glass"></i> Browse properties</a></section>${stats([['Saved properties',saved.length],['Upcoming inspections',inspections.length],['Verified saves',saved.length]])}`;return}if(mode==='buyer'&&page==='saved'){c.innerHTML=`<div class="section-title"><div><h2>Saved properties</h2><p class="lead">Your shortlist while you compare.</p></div><a class="btn dark" href="marketplace.html">Find property</a></div>${table(['Property','Area','Price','Status'],saved.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.area}</td><td>${x.price}</td><td><span class="badge">${x.status}</span></td><td><button class="action danger" data-del-saved="${x.id}"><i class="ph ph-trash"></i></button></td></tr>`))}`;bindDelete();return}if(mode==='buyer'&&page==='inspections'){c.innerHTML=`<div class="section-title"><div><h2>Inspections</h2><p class="lead">Schedule and manage visits.</p></div><button class="btn dark" onclick="openInspection()"><i class="ph ph-plus"></i> Book inspection</button></div>${stats([['Upcoming',inspections.length],['Completed','1'],['Total',inspections.length+1]])}${table(['Property','Date','Time','Type','Status'],inspections.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.date}</td><td>${x.time}</td><td>${x.type}</td><td><span class="badge">${x.status}</span></td><td><button class="action" onclick="openInspection(${x.id})"><i class="ph ph-pencil-simple"></i></button><button class="action danger" data-del-inspection="${x.id}"><i class="ph ph-trash"></i></button></td></tr>`))}`;bindDelete();return}if(mode==='lister'&&page==='overview'){c.innerHTML=`<section class="hero"><div class="hero-row"><div><div class="eyebrow">Property Lister</div><h2>Manage your properties simply.</h2><p>Your listings, verification progress and enquiries stay together.</p></div><button class="btn" style="background:#fff" onclick="openProperty()"><i class="ph ph-plus"></i> Add property</button></div></section>${stats([['Properties',properties.length],['Active listings',properties.filter(x=>x.status==='Active').length],['New enquiries',enquiries.filter(x=>x.status==='New').length],['Awaiting verification',properties.filter(x=>x.verification==='Pending').length]])}<div class="section-title"><div><h2>Recent enquiries</h2><p class="lead">Latest activity across your listings.</p></div><button class="btn" onclick="page='enquiries';setUrl();render()">View all</button></div>${enquiryTable(enquiries.slice(0,3))}`;bindEnquiries();return}if(mode==='lister'&&page==='properties'){c.innerHTML=`<div class="section-title"><div><h2>Properties</h2><p class="lead">Create, edit and manage your listings.</p></div><button class="btn dark" onclick="openProperty()"><i class="ph ph-plus"></i> Add property</button></div>${stats([['Active',properties.filter(x=>x.status==='Active').length],['Drafts',properties.filter(x=>x.status==='Draft').length],['Verified',properties.filter(x=>x.verification==='Verified').length]])}${table(['Property','Area','Price','Listing','Verification'],properties.map(x=>`<tr><td><b>${x.property}</b><div class="subtle">${x.type}</div></td><td>${x.area}</td><td>${x.price}</td><td><span class="badge ${x.status==='Draft'?'amber':''}">${x.status}</span></td><td>${x.verification}</td><td><button class="action" onclick="openProperty(${x.id})"><i class="ph ph-pencil-simple"></i></button><button class="action danger" data-del-property="${x.id}"><i class="ph ph-trash"></i></button></td></tr>`))}`;bindDelete();return}if(mode==='lister'&&page==='enquiries'){c.innerHTML=`<div class="section-title"><div><h2>Enquiries</h2><p class="lead">Review interest across your properties.</p></div></div>${stats([['New',enquiries.filter(x=>x.status==='New').length],['Viewed',enquiries.filter(x=>x.status==='Viewed').length],['Total',enquiries.length]])}${enquiryTable(enquiries)}`;bindEnquiries();return}}
function enquiryTable(items){return table(['Buyer / Renter','Property','Type','Received','Status'],items.map(x=>`<tr><td><b>${x.buyer}</b></td><td>${x.property}</td><td>${x.channel}</td><td>${x.received}</td><td><span class="badge">${x.status}</span></td><td><button class="action" data-enquiry="${x.id}"><i class="ph ph-eye"></i></button></td></tr>`))}function bindEnquiries(){document.querySelectorAll('[data-enquiry]').forEach(b=>b.onclick=()=>openEnquiry(+b.dataset.enquiry))}function bindDelete(){document.querySelectorAll('[data-del-saved]').forEach(b=>b.onclick=()=>askDelete('saved',+b.dataset.delSaved));document.querySelectorAll('[data-del-inspection]').forEach(b=>b.onclick=()=>askDelete('inspection',+b.dataset.delInspection));document.querySelectorAll('[data-del-property]').forEach(b=>b.onclick=()=>askDelete('property',+b.dataset.delProperty))}
accountSwitch.onchange=e=>{mode=e.target.value;page='overview';setUrl();render()};function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modalBack.classList.add('open')}function closeModal(){modalBack.classList.remove('open')}function openProperty(id){let x=id?properties.find(p=>p.id===id):{property:'',area:'',type:'Apartment',price:'',status:'Draft'};openModal(id?'Edit property':'Add property',`<form id="propertyForm" class="formgrid"><label>Property title<input id="pTitle" required value="${x.property}"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Area<input id="pArea" required value="${x.area}"></label><label>Type<select id="pType"><option>Apartment</option><option>Duplex</option><option>Terrace</option><option>Land</option><option>Development</option></select></label></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Price<input id="pPrice" required value="${x.price}"></label><label>Status<select id="pStatus"><option>Draft</option><option>Active</option></select></label></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn dark">${id?'Save changes':'Create property'}</button></div></form>`);pType.value=x.type;pStatus.value=x.status;propertyForm.onsubmit=e=>{e.preventDefault();let obj={property:pTitle.value,area:pArea.value,type:pType.value,price:pPrice.value,status:pStatus.value,verification:id?x.verification:'Not submitted'};if(id)Object.assign(x,obj);else properties.unshift({id:Date.now(),...obj});closeModal();render()}}
function openInspection(id){let x=id?inspections.find(i=>i.id===id):{property:'',date:'',time:'',type:'Physical'};openModal(id?'Edit inspection':'Book an inspection',`<form id="inspectionForm" class="formgrid"><label>Property<input id="iProperty" required value="${x.property}"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Date<input id="iDate" required value="${x.date}"></label><label>Time<input id="iTime" required value="${x.time}"></label></div><label>Type<select id="iType"><option>Physical</option><option>Video</option></select></label><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn dark">Save</button></div></form>`);iType.value=x.type;inspectionForm.onsubmit=e=>{e.preventDefault();let obj={property:iProperty.value,date:iDate.value,time:iTime.value,type:iType.value,status:'Upcoming'};if(id)Object.assign(x,obj);else inspections.unshift({id:Date.now(),...obj});closeModal();render()}}
function openEnquiry(id){let x=enquiries.find(e=>e.id===id);if(x.status==='New')x.status='Viewed';openModal('Enquiry details',`<div class="eyebrow">${x.channel}</div><h3 style="margin-top:8px">${x.buyer}</h3><p class="lead">${x.email} · ${x.received}</p><div class="messagebox"><b>${x.property}</b><p>${x.message}</p></div><div class="modalactions"><button class="btn" onclick="closeModal()">Close</button><a class="btn dark" href="mailto:${x.email}"><i class="ph ph-envelope-simple"></i> Reply by email</a></div>`)}function askDelete(kind,id){pendingDelete={kind,id};confirmText.textContent=kind==='property'?'This listing will be removed from your property list.':kind==='saved'?'Remove this property from your saved list?':'Remove this inspection from your schedule?';confirmModal.classList.add('open')}cancelDelete.onclick=()=>confirmModal.classList.remove('open');confirmDelete.onclick=()=>{if(pendingDelete.kind==='property')properties=properties.filter(x=>x.id!==pendingDelete.id);if(pendingDelete.kind==='saved')saved=saved.filter(x=>x.id!==pendingDelete.id);if(pendingDelete.kind==='inspection')inspections=inspections.filter(x=>x.id!==pendingDelete.id);confirmModal.classList.remove('open');render()};modalBack.onclick=e=>{if(e.target===modalBack)closeModal()};render();
</script></body></html>
