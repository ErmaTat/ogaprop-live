<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — OgaProp</title><link rel="stylesheet" href="assets/site.css"><script src="https://unpkg.com/@phosphor-icons/web"></script><style>body{background:#f7f7f5}.admin{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}.side{height:100vh;position:sticky;top:0;background:#fff;border-right:1px solid var(--line);padding:22px;display:flex;flex-direction:column;overflow:auto}.admincard{margin-top:28px;background:var(--black);color:#fff;border-radius:18px;padding:16px}.admincard small{color:var(--green);font-size:9px;font-weight:800;text-transform:uppercase}.admincard b{display:block;margin-top:4px;font-size:12px;color:#bbb}.adminnav{margin-top:22px;display:flex;flex-direction:column;gap:4px}.adminnav button{width:100%;border:0;background:none;border-radius:11px;padding:11px;display:flex;gap:10px;align-items:center;text-align:left;font:800 11px Manrope,sans-serif;color:var(--slate)}.adminnav button.active{background:var(--black);color:#fff}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:5px}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.content{max-width:1250px;margin:auto;padding:34px}.welcome{border-radius:30px;background:var(--black);color:#fff;padding:34px}.welcome h2{font-size:34px;letter-spacing:-.04em;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat span{font-size:11px;color:var(--slate)}.stat b{display:block;font-size:30px;margin-top:8px}.tablewrap{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:auto}.tablewrap table{width:100%;min-width:760px;border-collapse:collapse}.tablewrap th{background:#fafaf8;padding:13px 17px;text-align:left;font-size:10px;color:var(--slate);text-transform:uppercase}.tablewrap td{padding:16px 17px;border-top:1px solid var(--line);font-size:12px}.pill{padding:5px 9px;border-radius:99px;background:var(--green-soft);color:var(--green);font-size:10px;font-weight:800}.pill.pending{background:#fff7df;color:#9b6b00}.pill.bad{background:#fff0f0;color:#b42318}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.sectionhead h2{margin:0;font-size:26px}.iconbtn{border:0;background:none;padding:8px;border-radius:8px}.iconbtn:hover{background:#f4f4f2}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel h3{margin:0 0 8px;font-size:15px}.panel p{font-size:11px;color:var(--slate);line-height:1.7}.modalback{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:3000}.modalback.open{display:grid}.modal{width:min(580px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:26px;padding:26px}.modal h3{margin:0 0 14px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;flex-wrap:wrap}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detailitem{background:#f7f7f5;border-radius:13px;padding:13px}.detailitem small{display:block;color:var(--slate);font-size:9px;text-transform:uppercase;font-weight:800;margin-bottom:5px}.detailitem b{font-size:11px}.menubtn{display:none}@media(max-width:850px){.admin{grid-template-columns:1fr}.side{position:fixed;z-index:2000;width:260px;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.stats,.grid2{grid-template-columns:1fr 1fr}.content{padding:20px}.menubtn{display:inline-grid}}@media(max-width:520px){.stats,.grid2,.detailgrid{grid-template-columns:1fr}}</style></head><body><main class="admin"><aside class="side" id="side"><a class="brand" href="index.html"><span class="mark"></span><span>Oga<b>Prop</b></span></a><div class="admincard"><small>Admin workspace</small><b>OgaProp operations</b></div><nav class="adminnav" id="adminNav"></nav><div class="sidebottom"><a href="dashboard.html" class="btn"><i class="ph ph-arrow-up-right"></i> Buyer/Lister view</a><a href="index.html" class="btn"><i class="ph ph-house"></i> View site</a></div></aside><section><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn menubtn" id="menuBtn"><i class="ph ph-list"></i></button><div><div class="eyebrow">Admin</div><b id="pageTitle">Overview</b></div></div><div style="display:flex;gap:8px"><button class="btn"><i class="ph ph-bell"></i></button><button class="btn"><i class="ph ph-user-circle"></i> Admin User</button></div></header><div class="content" id="content"></div></section></main><div class="modalback" id="detailModal"><div class="modal"><h3 id="detailTitle"></h3><div id="detailBody"></div><div class="modalactions" id="detailActions"></div></div></div><div class="modalback" id="confirmModal"><div class="modal"><h3 id="confirmTitle">Confirm action</h3><p class="lead" id="confirmText"></p><div class="modalactions"><button class="btn" onclick="confirmModal.classList.remove('open')">Cancel</button><button class="btn dark" id="confirmBtn">Confirm</button></div></div></div><script>const items=[['Overview','house-line'],['Properties','buildings'],['Users','users-three'],['Verification','shield-check'],['Inspections','calendar-check'],['Enquiries','chats-circle'],['Areas','map-pin'],['Reports','chart-bar'],['Content','article'],['Settings','gear']];let page='Overview',selected=null;let properties=[{id:1,name:'Guzape Duplex',lister:'Prime Spaces',area:'Guzape',status:'Active',verification:'Verified'},{id:2,name:'Maitama Residence',lister:'Adeyemi Properties',area:'Maitama',status:'Active',verification:'Pending'},{id:3,name:'Katampe Land',lister:'Northgate Realty',area:'Katampe',status:'Review',verification:'Pending'}],users=[{id:1,name:'Amaka Obi',type:'Buyer / Renter',email:'amaka@example.com',status:'Active'},{id:2,name:'Prime Spaces Ltd',type:'Property Lister',email:'hello@primespaces.ng',status:'Active'},{id:3,name:'Adeyemi Properties',type:'Property Lister',email:'info@adeyemi.ng',status:'Review'}],checks=[{id:1,name:'Maitama Residence',lister:'Adeyemi Properties',check:'Ownership documents',submitted:'02 Sep',status:'Pending'},{id:2,name:'Katampe Land',lister:'Northgate Realty',check:'Title verification',submitted:'01 Sep',status:'Pending'},{id:3,name:'Jabi Terrace',lister:'CityHomes',check:'Property inspection',submitted:'29 Aug',status:'In review'}],inspections=[{id:1,name:'Guzape Duplex',customer:'Adaeze Okafor',date:'12 Sep 2026',type:'Physical',assignee:'Unassigned',status:'Scheduled'},{id:2,name:'Maitama Residence',customer:'Tunde Bello',date:'16 Sep 2026',type:'Video',assignee:'Sarah A.',status:'Scheduled'},{id:3,name:'Jabi Terrace',customer:'Mariam Yusuf',date:'28 Aug 2026',type:'Physical',assignee:'Daniel K.',status:'Completed'}],enquiries=[{id:1,name:'Adaeze Okafor',property:'Guzape Duplex',type:'Inspection',received:'Today',status:'New'},{id:2,name:'Tunde Bello',property:'Jabi Terrace',type:'Message',received:'Yesterday',status:'Replied'},{id:3,name:'Mariam Yusuf',property:'Katampe Land',type:'Verification',received:'02 Sep',status:'New'}];function pill(v){let c=['Pending','Review','In review','New','Unassigned'].includes(v)?'pending':['Suspended','Rejected','Hidden'].includes(v)?'bad':'';return `<span class="pill ${c}">${v}</span>`}function stats(a){return `<div class="stats">${a.map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}function table(h,rows,type){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${r.values.map((v,j)=>`<td>${j===0?'<b>'+v+'</b>':j===r.values.length-1?pill(v):v}</td>`).join('')}<td><button class="iconbtn" onclick="openDetail('${type}',${r.id})"><i class="ph ph-eye"></i></button></td></tr>`).join('')}</tbody></table></div>`}function header(t,n){return `<div class="sectionhead"><div><h2>${t}</h2><p class="lead">${n}</p></div></div>`}function rows(a,fn){return a.map(x=>({id:x.id,values:fn(x)}))}function render(){adminNav.innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="page='${x[0]}';side.classList.remove('open');render()"><i class="ph ph-${x[1]}"></i>${x[0]}</button>`).join('');pageTitle.textContent=page;if(page==='Overview'){content.innerHTML=`<div class="welcome"><div class="eyebrow">Operations</div><h2>OgaProp at a glance.</h2><p style="font-size:13px;color:#aaa">Marketplace operations, trust workflows and customer activity in one workspace.</p></div>${stats([['Properties',properties.length],['Users',users.length],['Pending checks',checks.filter(x=>x.status==='Pending').length],['Upcoming inspections',inspections.filter(x=>x.status==='Scheduled').length]])}${header('Verification queue','Items needing operational attention.')}${table(['Property','Lister','Check','Submitted','Status'],rows(checks,x=>[x.name,x.lister,x.check,x.submitted,x.status]),'verification')}`;return}if(page==='Properties'){content.innerHTML=header('Properties','Review, publish or hide marketplace listings.')+table(['Property','Lister','Area','Listing','Verification'],rows(properties,x=>[x.name,x.lister,x.area,x.status,x.verification]),'property');return}if(page==='Users'){content.innerHTML=header('Users','Review, suspend and reactivate platform accounts.')+stats([['Buyer / Renters',users.filter(x=>x.type==='Buyer / Renter').length],['Property Listers',users.filter(x=>x.type==='Property Lister').length],['Active',users.filter(x=>x.status==='Active').length],['Under review',users.filter(x=>x.status==='Review').length]])+table(['User','Account','Email','Status'],rows(users,x=>[x.name,x.type,x.email,x.status]),'user');return}if(page==='Verification'){content.innerHTML=header('Verification','Review submissions and record verification decisions.')+stats([['Pending',checks.filter(x=>x.status==='Pending').length],['In review',checks.filter(x=>x.status==='In review').length],['Approved',checks.filter(x=>x.status==='Approved').length],['Rejected',checks.filter(x=>x.status==='Rejected').length]])+table(['Property','Lister','Check','Submitted','Status'],rows(checks,x=>[x.name,x.lister,x.check,x.submitted,x.status]),'verification');return}if(page==='Inspections'){content.innerHTML=header('Inspections','Assign and manage physical or remote inspection bookings.')+stats([['Scheduled',inspections.filter(x=>x.status==='Scheduled').length],['Unassigned',inspections.filter(x=>x.assignee==='Unassigned').length],['Video',inspections.filter(x=>x.type==='Video').length],['Completed',inspections.filter(x=>x.status==='Completed').length]])+table(['Property','Customer','Date','Type','Assignee','Status'],rows(inspections,x=>[x.name,x.customer,x.date,x.type,x.assignee,x.status]),'inspection');return}if(page==='Enquiries'){content.innerHTML=header('Enquiries','Review and resolve customer activity across listings.')+stats([['New',enquiries.filter(x=>x.status==='New').length],['Open',enquiries.filter(x=>x.status==='Open').length],['Replied',enquiries.filter(x=>x.status==='Replied').length],['Total',enquiries.length]])+table(['Customer','Property','Type','Received','Status'],rows(enquiries,x=>[x.name,x.property,x.type,x.received,x.status]),'enquiry');return}if(page==='Areas'){content.innerHTML=header('Areas','Manage supported locations and marketplace coverage.')+`<div class="grid2"><div class="panel"><h3>Abuja</h3><p>9 active areas · current launch market</p>${pill('Active')}</div><div class="panel"><h3>Lagos</h3><p>Prepared for future marketplace expansion.</p>${pill('Pending')}</div></div>`;return}if(page==='Reports'){content.innerHTML=header('Reports','High-level marketplace and trust operations reporting.')+stats([['Listing views','24.8K'],['Enquiries','1,204'],['Inspection conversion','18%'],['Verified listings','71%']]);return}if(page==='Content'){content.innerHTML=header('Content','Manage lightweight site content.')+`<div class="grid2"><div class="panel"><h3>Property guides</h3><p>Manage guide titles and featured resources.</p><button class="btn">Manage guides</button></div><div class="panel"><h3>FAQ & process</h3><p>Update common questions and process content.</p><button class="btn">Manage content</button></div></div>`;return}content.innerHTML=header('Settings','Operational configuration for OgaProp.')+`<div class="grid2"><div class="panel"><h3>Marketplace settings</h3><p>Listing defaults and supported property types.</p><button class="btn">Configure</button></div><div class="panel"><h3>Admin profile</h3><p>Administrator profile and notification preferences.</p><button class="btn">Edit profile</button></div></div>`}function get(type,id){return (type==='property'?properties:type==='user'?users:type==='verification'?checks:type==='inspection'?inspections:enquiries).find(x=>x.id===id)}function detailItems(o,fields){return `<div class="detailgrid">${fields.map(([k,l])=>`<div class="detailitem"><small>${l}</small><b>${o[k]}</b></div>`).join('')}</div>`}function openDetail(type,id){let o=get(type,id);selected={type,id};detailTitle.textContent=o.name;let fields=type==='property'?[['lister','Lister'],['area','Area'],['status','Listing status'],['verification','Verification']]:type==='user'?[['type','Account type'],['email','Email'],['status','Status']]:type==='verification'?[['lister','Lister'],['check','Check'],['submitted','Submitted'],['status','Status']]:type==='inspection'?[['customer','Customer'],['date','Date'],['type','Type'],['assignee','Assignee'],['status','Status']]:[['property','Property'],['type','Enquiry type'],['received','Received'],['status','Status']];detailBody.innerHTML=detailItems(o,fields);let a=`<button class="btn" onclick="detailModal.classList.remove('open')">Close</button>`;if(type==='property')a+=o.status==='Hidden'?`<button class="btn dark" onclick="act('publish')">Publish</button>`:`<button class="btn" onclick="ask('hide')">Hide listing</button>`;if(type==='user')a+=o.status==='Suspended'?`<button class="btn dark" onclick="act('reactivate')">Reactivate</button>`:`<button class="btn" onclick="ask('suspend')">Suspend</button>`;if(type==='verification')a+=`<button class="btn" onclick="ask('reject')">Reject</button><button class="btn dark" onclick="act('approve')">Approve</button>`;if(type==='inspection')a+=`<button class="btn" onclick="act('assign')">Assign staff</button><button class="btn dark" onclick="act('complete')">Mark complete</button>`;if(type==='enquiry')a+=`<button class="btn" onclick="act('open')">Mark open</button><button class="btn dark" onclick="act('resolve')">Mark replied</button>`;detailActions.innerHTML=a;detailModal.classList.add('open')}function act(action){let o=get(selected.type,selected.id);if(action==='publish')o.status='Active';if(action==='reactivate')o.status='Active';if(action==='approve')o.status='Approved';if(action==='assign')o.assignee='Operations Team';if(action==='complete')o.status='Completed';if(action==='open')o.status='Open';if(action==='resolve')o.status='Replied';detailModal.classList.remove('open');render()}function ask(action){detailModal.classList.remove('open');let labels={hide:['Hide this listing?','The listing will no longer be shown as active.'],suspend:['Suspend this account?','The user account will be marked as suspended.'],reject:['Reject this verification?','The verification submission will be marked as rejected.']};confirmTitle.textContent=labels[action][0];confirmText.textContent=labels[action][1];confirmBtn.onclick=()=>{let o=get(selected.type,selected.id);if(action==='hide')o.status='Hidden';if(action==='suspend')o.status='Suspended';if(action==='reject')o.status='Rejected';confirmModal.classList.remove('open');render()};confirmModal.classList.add('open')}menuBtn.onclick=()=>side.classList.toggle('open');render();</script></body></html>
