<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — OgaProp</title><link rel="stylesheet" href="assets/site.css"><script src="https://unpkg.com/@phosphor-icons/web"></script><style>body{background:#f7f7f5}.admin{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}.side{height:100vh;position:sticky;top:0;background:#fff;border-right:1px solid var(--line);padding:22px;display:flex;flex-direction:column;overflow:auto}.admincard{margin-top:28px;background:var(--black);color:#fff;border-radius:18px;padding:16px}.admincard small{color:var(--green);font-size:9px;font-weight:800;text-transform:uppercase}.admincard b{display:block;margin-top:4px;font-size:12px;color:#bbb}.adminnav{margin-top:22px;display:flex;flex-direction:column;gap:4px}.adminnav button{width:100%;border:0;background:none;border-radius:11px;padding:11px;display:flex;gap:10px;align-items:center;text-align:left;font:800 11px Manrope,sans-serif;color:var(--slate)}.adminnav button.active{background:var(--black);color:#fff}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:5px}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.content{max-width:1250px;margin:auto;padding:34px}.welcome{border-radius:30px;background:var(--black);color:#fff;padding:34px}.welcome h2{font-size:34px;letter-spacing:-.04em;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat span{font-size:11px;color:var(--slate)}.stat b{display:block;font-size:30px;margin-top:8px}.tablewrap{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:auto}.tablewrap table{width:100%;min-width:760px;border-collapse:collapse}.tablewrap th{background:#fafaf8;padding:13px 17px;text-align:left;font-size:10px;color:var(--slate);text-transform:uppercase}.tablewrap td{padding:16px 17px;border-top:1px solid var(--line);font-size:12px}.pill{padding:5px 9px;border-radius:99px;background:var(--green-soft);color:var(--green);font-size:10px;font-weight:800}.pill.pending{background:#fff7df;color:#9b6b00}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.sectionhead h2{margin:0;font-size:26px}.iconbtn{border:0;background:none;padding:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel h3{margin:0 0 8px;font-size:15px}.panel p{font-size:11px;color:var(--slate);line-height:1.7}.modalback{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:3000}.modalback.open{display:grid}.modal{width:min(520px,100%);background:#fff;border-radius:26px;padding:26px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.menubtn{display:none}@media(max-width:850px){.admin{grid-template-columns:1fr}.side{position:fixed;z-index:2000;width:260px;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.stats,.grid2{grid-template-columns:1fr 1fr}.content{padding:20px}.menubtn{display:inline-grid}}@media(max-width:520px){.stats,.grid2{grid-template-columns:1fr}}</style></head><body><main class="admin"><aside class="side" id="side"><a class="brand" href="index.html"><span class="mark"></span><span>Oga<b>Prop</b></span></a><div class="admincard"><small>Admin workspace</small><b>OgaProp operations</b></div><nav class="adminnav" id="adminNav"></nav><div class="sidebottom"><a href="dashboard.html" class="btn"><i class="ph ph-arrow-up-right"></i> Buyer/Lister view</a><a href="index.html" class="btn"><i class="ph ph-house"></i> View site</a></div></aside><section><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn menubtn" id="menuBtn"><i class="ph ph-list"></i></button><div><div class="eyebrow">Admin</div><b id="pageTitle">Overview</b></div></div><div style="display:flex;gap:8px"><button class="btn"><i class="ph ph-bell"></i></button><button class="btn"><i class="ph ph-user-circle"></i> Admin User</button></div></header><div class="content" id="content"></div></section></main><div class="modalback" id="detailModal"><div class="modal"><h3 id="detailTitle">Details</h3><div id="detailBody"></div><div class="modalactions"><button class="btn" onclick="detailModal.classList.remove('open')">Close</button></div></div></div><script>const items=[['Overview','house-line'],['Properties','buildings'],['Users','users-three'],['Verification','shield-check'],['Inspections','calendar-check'],['Enquiries','chats-circle'],['Areas','map-pin'],['Reports','chart-bar'],['Content','article'],['Settings','gear']];let page='Overview';let properties=[['Guzape Duplex','Prime Spaces','Guzape','Active','Verified'],['Maitama Residence','Adeyemi Properties','Maitama','Active','Pending'],['Katampe Land','Northgate Realty','Katampe','Review','Pending']],users=[['Amaka Obi','Buyer / Renter','amaka@example.com','Active'],['Prime Spaces Ltd','Property Lister','hello@primespaces.ng','Active'],['Adeyemi Properties','Property Lister','info@adeyemi.ng','Review']],checks=[['Maitama Residence','Adeyemi Properties','Ownership documents','02 Sep','Pending'],['Katampe Land','Northgate Realty','Title verification','01 Sep','Pending'],['Jabi Terrace','CityHomes','Property inspection','29 Aug','In review']],inspections=[['Guzape Duplex','Adaeze Okafor','12 Sep 2026','Physical','Scheduled'],['Maitama Residence','Tunde Bello','16 Sep 2026','Video','Scheduled'],['Jabi Terrace','Mariam Yusuf','28 Aug 2026','Physical','Completed']],enquiries=[['Adaeze Okafor','Guzape Duplex','Inspection','Today','New'],['Tunde Bello','Jabi Terrace','Message','Yesterday','Replied'],['Mariam Yusuf','Katampe Land','Verification','02 Sep','New']];function stats(a){return `<div class="stats">${a.map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}function pill(v){return `<span class="pill ${['Pending','Review','In review','New'].includes(v)?'pending':''}">${v}</span>`}function table(h,rows){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td>${j===0?'<b>'+v+'</b>':j===r.length-1?pill(v):v}</td>`).join('')}<td><button class="iconbtn" onclick="details('${r[0]}')"><i class="ph ph-eye"></i></button></td></tr>`).join('')}</tbody></table></div>`}function details(n){detailTitle.textContent=n;detailBody.innerHTML=`<div class="panel"><p>This opens the operational detail/review flow for <b>${n}</b>. Backend actions can plug into this modal later.</p></div>`;detailModal.classList.add('open')}function header(title,note){return `<div class="sectionhead"><div><h2>${title}</h2><p class="lead">${note}</p></div></div>`}function render(){adminNav.innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="page='${x[0]}';side.classList.remove('open');render()"><i class="ph ph-${x[1]}"></i>${x[0]}</button>`).join('');pageTitle.textContent=page;if(page==='Overview'){content.innerHTML=`<div class="welcome"><div class="eyebrow">Operations</div><h2>OgaProp at a glance.</h2><p style="font-size:13px;color:#aaa">Marketplace operations, trust workflows and customer activity in one workspace.</p></div>${stats([['Properties',128],['Users',846],['Pending checks',12],['Inspections this week',18]])}${header('Verification queue','Items needing operational attention.')}${table(['Property','Lister','Check','Submitted','Status'],checks)}`;return}if(page==='Properties'){content.innerHTML=header('Properties','Review and moderate marketplace listings.')+table(['Property','Lister','Area','Listing','Verification'],properties);return}if(page==='Users'){content.innerHTML=header('Users','Manage Buyer/Renter and Property Lister accounts.')+stats([['Buyer / Renters',624],['Property Listers',222],['New this month',74],['Under review',6]])+table(['User','Account','Email','Status'],users);return}if(page==='Verification'){content.innerHTML=header('Verification','Manage property verification submissions and decisions.')+stats([['Pending',12],['In review',7],['Approved this month',46],['Rejected',3]])+table(['Property','Lister','Check','Submitted','Status'],checks);return}if(page==='Inspections'){content.innerHTML=header('Inspections','Monitor physical and remote inspection bookings.')+stats([['Upcoming',18],['Video',7],['Physical',11],['Completed this month',54]])+table(['Property','Customer','Date','Type','Status'],inspections);return}if(page==='Enquiries'){content.innerHTML=header('Enquiries','See customer enquiries across marketplace listings.')+stats([['New',9],['Open',21],['Replied',68],['This month',98]])+table(['Customer','Property','Type','Received','Status'],enquiries);return}if(page==='Areas'){content.innerHTML=header('Areas','Manage supported locations and marketplace coverage.')+`<div class="grid2"><div class="panel"><h3>Abuja</h3><p>9 active areas · 112 listings</p>${pill('Active')}</div><div class="panel"><h3>Lagos</h3><p>Prepared for future marketplace expansion.</p>${pill('Pending')}</div></div>`;return}if(page==='Reports'){content.innerHTML=header('Reports','High-level marketplace and operations reporting.')+stats([['Listing views','24.8K'],['Enquiries','1,204'],['Inspection conversion','18%'],['Verified listings','71%']])+`<div class="grid2" style="margin-top:18px"><div class="panel"><h3>Marketplace performance</h3><p>Placeholder for listing, location and demand reporting when real analytics data is connected.</p></div><div class="panel"><h3>Trust operations</h3><p>Verification turnaround, approval rate and inspection activity.</p></div></div>`;return}if(page==='Content'){content.innerHTML=header('Content','Manage lightweight site content without building a full CMS.')+`<div class="grid2"><div class="panel"><h3>Property guides</h3><p>Manage guide titles, visibility and featured resources.</p><button class="btn">Manage guides</button></div><div class="panel"><h3>FAQ & process</h3><p>Update frequently asked questions and verification process content.</p><button class="btn">Manage content</button></div></div>`;return}content.innerHTML=header('Settings','Operational configuration for the OgaProp platform.')+`<div class="grid2"><div class="panel"><h3>Marketplace settings</h3><p>Listing defaults, supported property types and general platform options.</p><button class="btn">Configure</button></div><div class="panel"><h3>Admin profile</h3><p>Administrator account and notification preferences.</p><button class="btn">Edit profile</button></div></div>`}menuBtn.onclick=()=>side.classList.toggle('open');render();</script></body></html>
