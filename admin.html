<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — OgaProp</title><link rel="stylesheet" href="assets/site.css"><script src="https://unpkg.com/@phosphor-icons/web"></script><style>body{background:#f7f7f5}.admin{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}.side{min-height:100vh;background:#fff;border-right:1px solid var(--line);padding:22px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.side .brand{display:flex}.admincard{margin-top:28px;background:var(--black);color:#fff;border-radius:18px;padding:16px}.admincard small{color:var(--green);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.admincard b{display:block;margin-top:4px;font-size:12px;color:#bbb}.adminnav{margin-top:26px;display:flex;flex-direction:column;gap:5px}.adminnav button{width:100%;border:0;background:none;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;text-align:left;font:800 12px Manrope,sans-serif;color:var(--slate)}.adminnav button.active{background:var(--black);color:#fff}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.content{max-width:1250px;margin:auto;padding:34px}.welcome{border-radius:30px;background:var(--black);color:#fff;padding:34px}.welcome h2{font-size:34px;letter-spacing:-.04em;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat span{font-size:11px;color:var(--slate)}.stat b{display:block;font-size:30px;margin-top:8px}.tablewrap{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:auto}.tablewrap table{width:100%;min-width:760px;border-collapse:collapse}.tablewrap th{background:#fafaf8;padding:13px 17px;text-align:left;font-size:10px;color:var(--slate);text-transform:uppercase}.tablewrap td{padding:16px 17px;border-top:1px solid var(--line);font-size:12px}.pill{padding:5px 9px;border-radius:99px;background:var(--green-soft);color:var(--green);font-size:10px;font-weight:800}.pill.pending{background:#fff7df;color:#9b6b00}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.sectionhead h2{margin:0;font-size:26px}.iconbtn{border:0;background:none;padding:8px;border-radius:8px}.iconbtn:hover{background:var(--soft)}.modalback{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:3000}.modalback.open{display:grid}.modal{width:min(520px,100%);background:#fff;border-radius:26px;padding:26px}.modal h3{margin:0 0 12px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.menubtn{display:none}@media(max-width:850px){.admin{grid-template-columns:1fr}.side{position:fixed;z-index:2000;width:260px;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.stats{grid-template-columns:1fr 1fr}.content{padding:20px}.top{padding:0 20px}.menubtn{display:inline-grid}}</style></head><body><main class="admin"><aside class="side" id="side"><a class="brand" href="index.html"><span class="mark"></span><span>Oga<b>Prop</b></span></a><div class="admincard"><small>Admin workspace</small><b>OgaProp operations</b></div><nav class="adminnav" id="adminNav"></nav><div class="sidebottom"><a href="dashboard.html" class="btn"><i class="ph ph-arrow-up-right"></i> Buyer/Lister view</a><a href="index.html" class="btn"><i class="ph ph-house"></i> View site</a></div></aside><section><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn menubtn" id="menuBtn"><i class="ph ph-list"></i></button><div><div class="eyebrow">Admin</div><b id="pageTitle">Overview</b></div></div><div style="display:flex;gap:8px"><button class="btn"><i class="ph ph-bell"></i></button><button class="btn"><i class="ph ph-user-circle"></i> Admin User</button></div></header><div class="content" id="content"></div></section></main><div class="modalback" id="detailModal"><div class="modal"><h3 id="detailTitle">Review</h3><div id="detailBody"></div><div class="modalactions" id="detailActions"><button class="btn" onclick="closeDetail()">Close</button></div></div></div><div class="modalback" id="confirmModal"><div class="modal"><h3 id="confirmTitle">Confirm action</h3><p class="lead" id="confirmText"></p><div class="modalactions"><button class="btn" onclick="confirmModal.classList.remove('open')">Cancel</button><button class="btn dark" id="doConfirm">Confirm</button></div></div></div><script>const items=[['Overview','house-line'],['Properties','buildings'],['Users','users-three'],['Verification','shield-check']];let page='Overview',selected=null;let properties=[{id:1,property:'Contemporary 4-Bedroom Duplex',lister:'Prime Spaces Ltd',area:'Guzape',status:'Active',verification:'Verified'},{id:2,property:'Premium Family Residence',lister:'Adeyemi Properties',area:'Maitama',status:'Active',verification:'Pending'},{id:3,property:'Residential Land Parcel',lister:'Northgate Realty',area:'Katampe',status:'Review',verification:'Pending'}],users=[{id:1,name:'Amaka Obi',type:'Buyer / Renter',email:'amaka@example.com',status:'Active'},{id:2,name:'Prime Spaces Ltd',type:'Property Lister',email:'hello@primespaces.ng',status:'Active'},{id:3,name:'Adeyemi Properties',type:'Property Lister',email:'info@adeyemi.ng',status:'Review'}],checks=[{id:1,property:'Premium Family Residence',lister:'Adeyemi Properties',check:'Ownership documents',submitted:'02 Sep 2026',status:'Pending'},{id:2,property:'Residential Land Parcel',lister:'Northgate Realty',check:'Title verification',submitted:'01 Sep 2026',status:'Pending'},{id:3,property:'Jabi Terrace Home',lister:'CityHomes',check:'Property inspection',submitted:'29 Aug 2026',status:'In review'}];function stats(a){return `<div class="stats">${a.map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}<th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function pill(v){return `<span class="pill ${v==='Pending'||v==='Review'||v==='In review'?'pending':''}">${v}</span>`}function render(){adminNav.innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" data-page="${x[0]}"><i class="ph ph-${x[1]}"></i>${x[0]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;side.classList.remove('open');render()});pageTitle.textContent=page;if(page==='Overview'){content.innerHTML=`<div class="welcome"><div class="eyebrow">Operations</div><h2>OgaProp at a glance.</h2><p style="font-size:13px;color:#aaa;max-width:620px">Properties, accounts and verification work in one compact operational workspace.</p></div>${stats([['Properties',properties.length],['Users',users.length],['Pending checks',checks.filter(x=>x.status!=='Approved').length],['Active listings',properties.filter(x=>x.status==='Active').length]])}<div class="sectionhead" style="margin-top:28px"><div><h2>Verification queue</h2><p class="lead">Items needing operational attention.</p></div><button class="btn" onclick="page='Verification';render()">View all</button></div>${table(['Property','Lister','Check','Submitted'],checks.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.lister}</td><td>${x.check}</td><td>${x.submitted}</td><td></td></tr>`))}`;return}if(page==='Properties'){content.innerHTML=`<div class="sectionhead"><div><h2>Properties</h2><p class="lead">Review marketplace listings without duplicating lister tools.</p></div></div>${table(['Property','Lister','Area','Listing','Verification'],properties.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.lister}</td><td>${x.area}</td><td>${pill(x.status)}</td><td>${pill(x.verification)}</td><td><button class="iconbtn" onclick="showDetail('property',${x.id})"><i class="ph ph-eye"></i></button></td></tr>`))}`;return}if(page==='Users'){content.innerHTML=`<div class="sectionhead"><div><h2>Users</h2><p class="lead">Buyer/Renter and Property Lister accounts.</p></div></div>${table(['User','Account','Email','Status'],users.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.type}</td><td>${x.email}</td><td>${pill(x.status)}</td><td><button class="iconbtn" onclick="showDetail('user',${x.id})"><i class="ph ph-eye"></i></button></td></tr>`))}`;return}content.innerHTML=`<div class="sectionhead"><div><h2>Verification</h2><p class="lead">Approve or reject submitted verification checks.</p></div></div>${stats([['Pending',checks.filter(x=>x.status==='Pending').length],['In review',checks.filter(x=>x.status==='In review').length],['Total queue',checks.length]])}${table(['Property','Lister','Check','Submitted','Status'],checks.map(x=>`<tr><td><b>${x.property}</b></td><td>${x.lister}</td><td>${x.check}</td><td>${x.submitted}</td><td>${pill(x.status)}</td><td><button class="iconbtn" onclick="showDetail('verification',${x.id})"><i class="ph ph-eye"></i></button></td></tr>`))}`}function showDetail(type,id){selected={type,row:(type==='property'?properties:type==='user'?users:checks).find(x=>x.id===id)};detailTitle.textContent=type==='user'?'Account details':type==='property'?'Property review':'Verification review';detailBody.innerHTML=`<div style="background:#f7f7f5;border-radius:16px;padding:18px"><b>${selected.row.property||selected.row.name}</b><p class="lead">${selected.row.email||selected.row.lister} · ${selected.row.area||selected.row.check||selected.row.type}</p></div>`;detailActions.innerHTML=`<button class="btn" onclick="closeDetail()">Close</button>`+(type==='verification'?`<button class="btn" onclick="askReject()">Reject</button><button class="btn dark" onclick="approve()">Approve</button>`:type==='user'?`<button class="btn dark" onclick="askSuspend()">Suspend</button>`:'');detailModal.classList.add('open')}function closeDetail(){detailModal.classList.remove('open')}function approve(){selected.row.status='Approved';closeDetail();render()}function askReject(){closeDetail();confirmTitle.textContent='Reject this verification?';confirmText.textContent='This submission will be marked as rejected.';doConfirm.onclick=()=>{selected.row.status='Rejected';confirmModal.classList.remove('open');render()};confirmModal.classList.add('open')}function askSuspend(){closeDetail();confirmTitle.textContent='Suspend this account?';confirmText.textContent='The account will be marked as suspended.';doConfirm.onclick=()=>{selected.row.status='Suspended';confirmModal.classList.remove('open');render()};confirmModal.classList.add('open')}menuBtn.onclick=()=>side.classList.toggle('open');render();</script></body></html>
