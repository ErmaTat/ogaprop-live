<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — OgaProp</title><link rel="stylesheet" href="assets/site.css"><script src="https://unpkg.com/@phosphor-icons/web"></script><style>body{background:#f7f7f5}.admin{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:22px;display:flex;flex-direction:column}.admincard{margin-top:28px;background:var(--black);color:#fff;border-radius:18px;padding:16px}.admincard small{color:var(--green);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.admincard b{display:block;margin-top:4px;font-size:12px;color:#bbb}.nav{margin-top:26px}.nav button{width:100%;border:0;background:none;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;font:800 12px Manrope,sans-serif;color:var(--slate)}.nav button.active{background:var(--black);color:#fff}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}.top{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.content{max-width:1250px;margin:auto;padding:34px}.welcome{border-radius:30px;background:var(--black);color:#fff;padding:34px}.welcome h2{font-size:34px;letter-spacing:-.04em;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat span{font-size:11px;color:var(--slate)}.stat b{display:block;font-size:30px;margin-top:8px}.placeholder{background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px}@media(max-width:850px){.admin{grid-template-columns:1fr}.side{display:none}.stats{grid-template-columns:1fr 1fr}.content{padding:20px}.top{padding:0 20px}}</style></head><body><main class="admin"><aside class="side"><a class="brand" href="index.html"><span class="mark"></span><span>Oga<b>Prop</b></span></a><div class="admincard"><small>Admin workspace</small><b>OgaProp operations</b></div><nav class="nav" id="nav"></nav><div class="sidebottom"><a href="dashboard.html" class="btn"><i class="ph ph-arrow-up-right"></i> Buyer/Lister view</a><a href="index.html" class="btn" style="margin-top:6px"><i class="ph ph-house"></i> View site</a></div></aside><section><header class="top"><div><div class="eyebrow">Admin</div><b id="pageTitle">Overview</b></div><div style="display:flex;gap:8px"><button class="btn"><i class="ph ph-bell"></i></button><button class="btn"><i class="ph ph-user-circle"></i> Admin User</button></div></header><div class="content" id="content"></div></section></main><script>const items=[['Overview','house-line'],['Properties','buildings'],['Users','users-three'],['Verification','shield-check']];let page='Overview';function render(){nav.innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" data-page="${x[0]}"><i class="ph ph-${x[1]}"></i>${x[0]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});pageTitle.textContent=page;if(page==='Overview'){content.innerHTML=`<div class="welcome"><div class="eyebrow">Operations</div><h2>OgaProp at a glance.</h2><p style="font-size:13px;color:#aaa;max-width:620px">A compact operational view for properties, users and verification work.</p></div><div class="stats"><div class="stat"><span>Properties</span><b>148</b></div><div class="stat"><span>Users</span><b>324</b></div><div class="stat"><span>Pending checks</span><b>17</b></div><div class="stat"><span>Open reviews</span><b>31</b></div></div>`}else content.innerHTML=`<div class="placeholder"><div class="eyebrow">Admin workspace</div><h2>${page}</h2><p class="lead">This section will reuse the same shared table, stat, modal and confirmation patterns as we build it.</p></div>`}render();</script></body></html>
